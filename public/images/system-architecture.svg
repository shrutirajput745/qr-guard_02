<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#090d16; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#00f0ff" />
    </marker>

    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981" />
    </marker>

    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b" />
    </marker>

    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="1200" height="780" fill="url(#grid)" />
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="154" height="26" rx="6" fill="#0d2847" stroke="#00f0ff" stroke-width="1" />
    <text x="77" y="17" fill="#00f0ff" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SYSTEM ARCHITECTURE</text>

    <text x="0" y="56" fill="#f8fafc" font-size="24" font-weight="800">QR Guard: End-to-End Technical Data Flow</text>
    <text x="0" y="78" fill="#94a3b8" font-size="13">Transparent heuristic inspection pipeline separating active features from planned research workflows.</text>
  </g>

  <!-- Status Legend -->
  <g transform="translate(850, 48)">
    <rect x="0" y="0" width="290" height="52" rx="8" fill="#0e1726" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="26" r="6" fill="#10b981" />
    <text x="34" y="30" fill="#f8fafc" font-size="12" font-weight="600">Active Implemented Flow</text>

    <circle cx="168" cy="26" r="6" fill="#f59e0b" />
    <text x="182" y="30" fill="#f59e0b" font-size="12" font-weight="600">Planned (Under Dev)</text>
  </g>

  <!-- ==================================================================== -->
  <!-- MAIN WORKFLOW (IMPLEMENTED & ACTIVE) -->
  <!-- ==================================================================== -->

  <!-- Pipeline Bounding Container -->
  <rect x="50" y="140" width="1100" height="370" rx="16" fill="#0b1322" stroke="#1e3a5f" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="50" y="140" width="1100" height="38" rx="16" fill="#0f1e38" />
  <text x="75" y="165" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">PRIMARY RUNTIME PIPELINE (CLIENT-SIDE EXECUTION)</text>
  <rect x="990" y="148" width="145" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
  <text x="1062" y="163" fill="#6ee7b7" font-size="10.5" font-weight="700" text-anchor="middle">VERIFIED ACTIVE</text>

  <!-- STAGE 1: USER & INPUT -->
  <g transform="translate(75, 205)">
    <rect width="180" height="275" rx="12" fill="#111c30" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
    <text x="33" y="39" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    <text x="60" y="32" fill="#f8fafc" font-size="14" font-weight="700">User Input</text>
    <text x="60" y="48" fill="#38bdf8" font-size="11" font-weight="600">Acquisition</text>

    <!-- Sub items -->
    <g transform="translate(15, 75)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">Live Camera</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">MediaDevices video stream</text>
    </g>

    <g transform="translate(15, 137)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">File Drag &amp; Drop</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">PNG, JPG, WebP image</text>
    </g>

    <g transform="translate(15, 199)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">HTML5 Canvas</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">Pixel buffer extraction</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="255" y1="340" x2="285" y2="340" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- STAGE 2: QR DECODING -->
  <g transform="translate(295, 205)">
    <rect width="180" height="275" rx="12" fill="#111c30" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#083344" stroke="#00f0ff" stroke-width="1" />
    <text x="33" y="39" fill="#00f0ff" font-size="16" font-weight="bold" text-anchor="middle">2</text>
    <text x="60" y="32" fill="#f8fafc" font-size="14" font-weight="700">QR Decoding</text>
    <text x="60" y="48" fill="#00f0ff" font-size="11" font-weight="600">Extraction</text>

    <g transform="translate(15, 75)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">Finder Patterns</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">3 corner alignment locate</text>
    </g>

    <g transform="translate(15, 137)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">Binarization</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">Adaptive luminance grid</text>
    </g>

    <g transform="translate(15, 199)">
      <rect width="150" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="22" fill="#f1f5f9" font-size="12" font-weight="600">Reed-Solomon</text>
      <text x="12" y="40" fill="#94a3b8" font-size="10.5">Error correction decode</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="475" y1="340" x2="505" y2="340" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- STAGE 3: CONTENT CLASSIFICATION -->
  <g transform="translate(515, 205)">
    <rect width="180" height="275" rx="12" fill="#111c30" stroke="#a78bfa" stroke-width="1.5" />
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#2e1065" stroke="#a78bfa" stroke-width="1" />
    <text x="33" y="39" fill="#a78bfa" font-size="16" font-weight="bold" text-anchor="middle">3</text>
    <text x="60" y="32" fill="#f8fafc" font-size="14" font-weight="700">Classification</text>
    <text x="60" y="48" fill="#a78bfa" font-size="11" font-weight="600">Payload Routing</text>

    <g transform="translate(15, 75)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="26" fill="#38bdf8" font-size="12" font-weight="600">Web URL (HTTP/S)</text>
    </g>

    <g transform="translate(15, 127)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="26" fill="#34d399" font-size="12" font-weight="600">Wi-Fi Config (WIFI:)</text>
    </g>

    <g transform="translate(15, 179)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="26" fill="#fbbf24" font-size="12" font-weight="600">UPI / Payment QR</text>
    </g>

    <g transform="translate(15, 231)">
      <rect width="150" height="36" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="12" y="23" fill="#94a3b8" font-size="11" font-weight="500">vCard / SMS / Mail / Text</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="695" y1="340" x2="725" y2="340" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- STAGE 4: URL ANALYSIS -->
  <g transform="translate(735, 205)">
    <rect width="180" height="275" rx="12" fill="#111c30" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="33" y="39" fill="#f59e0b" font-size="16" font-weight="bold" text-anchor="middle">4</text>
    <text x="60" y="32" fill="#f8fafc" font-size="14" font-weight="700">URL Analysis</text>
    <text x="60" y="48" fill="#f59e0b" font-size="11" font-weight="600">Static Heuristics</text>

    <g transform="translate(15, 75)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="19" fill="#f1f5f9" font-size="11" font-weight="600">Protocol &amp; IP Check</text>
      <text x="10" y="33" fill="#94a3b8" font-size="9.5">Plain HTTP, raw IP address</text>
    </g>

    <g transform="translate(15, 127)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="19" fill="#f1f5f9" font-size="11" font-weight="600">Phishing Keywords</text>
      <text x="10" y="33" fill="#94a3b8" font-size="9.5">Brand impersonation keywords</text>
    </g>

    <g transform="translate(15, 179)">
      <rect width="150" height="42" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="19" fill="#f1f5f9" font-size="11" font-weight="600">Deceptive Patterns</text>
      <text x="10" y="33" fill="#94a3b8" font-size="9.5">Shorteners, @ signs, high-risk TLD</text>
    </g>

    <g transform="translate(15, 231)">
      <rect width="150" height="36" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="23" fill="#f59e0b" font-size="10.5" font-weight="700">Penalty Clamping (0-100)</text>
    </g>
  </g>

  <!-- Connector 4 -> 5 -->
  <line x1="915" y1="340" x2="945" y2="340" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)" />

  <!-- STAGE 5: RESULT PRESENTATION -->
  <g transform="translate(955, 205)">
    <rect width="175" height="275" rx="12" fill="#111c30" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="16" width="36" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="33" y="39" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">5</text>
    <text x="60" y="32" fill="#f8fafc" font-size="14" font-weight="700">Display Result</text>
    <text x="60" y="48" fill="#10b981" font-size="11" font-weight="600">User Verdict</text>

    <g transform="translate(15, 75)">
      <rect width="145" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="22" fill="#10b981" font-size="11.5" font-weight="700">Verdict Badges</text>
      <text x="10" y="40" fill="#94a3b8" font-size="10">Safe / Suspicious / Danger</text>
    </g>

    <g transform="translate(15, 137)">
      <rect width="145" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="22" fill="#38bdf8" font-size="11.5" font-weight="700">Itemized Evidence</text>
      <text x="10" y="40" fill="#94a3b8" font-size="10">Transparent rule reasons</text>
    </g>

    <g transform="translate(15, 199)">
      <rect width="145" height="52" rx="8" fill="#0d1726" stroke="#1e293b" />
      <text x="10" y="22" fill="#f1f5f9" font-size="11.5" font-weight="700">Defanged Preview</text>
      <text x="10" y="40" fill="#94a3b8" font-size="10">Zero auto-navigation shield</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- PLANNED WORKFLOW: BLUR RECOVERY LAB (SEPARATE & UNDER DEVELOPMENT) -->
  <!-- ==================================================================== -->

  <g transform="translate(50, 545)">
    <!-- Container with Dashed Border -->
    <rect width="1100" height="190" rx="16" fill="#101726" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,5" />
    <rect width="1100" height="34" rx="16" fill="#1e1b18" />

    <text x="25" y="23" fill="#f59e0b" font-size="12" font-weight="700" letter-spacing="1">RESEARCH &amp; FUTURE ENHANCEMENT WORKFLOW</text>

    <!-- Prominent "Under Development" Badge -->
    <rect x="880" y="6" width="205" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="982" y="21" fill="#fbbf24" font-size="10.5" font-weight="700" text-anchor="middle">PLANNED — UNDER DEVELOPMENT</text>

    <!-- Step A: Blurry QR Image Input -->
    <g transform="translate(35, 52)">
      <rect width="260" height="115" rx="10" fill="#151f33" stroke="#334155" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#1e293b" />
      <text x="29" y="34" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">A</text>
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">Blurry / Degraded QR</text>
      <text x="52" y="44" fill="#94a3b8" font-size="10.5">Out-of-focus or low-contrast file</text>

      <text x="15" y="78" fill="#94a3b8" font-size="11">• Standard scanners fail to localize</text>
      <text x="15" y="96" fill="#94a3b8" font-size="11">• Inadequate pixel edge contrast</text>
    </g>

    <!-- Arrow A -> B -->
    <line x1="305" y1="110" x2="350" y2="110" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />

    <!-- Step B: Planned Image Preprocessing -->
    <g transform="translate(365, 52)">
      <rect width="370" height="115" rx="10" fill="#171e2e" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,4" />
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
      <text x="29" y="34" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">B</text>
      <text x="52" y="28" fill="#f59e0b" font-size="13" font-weight="700">Planned Image Preprocessing</text>
      <text x="52" y="44" fill="#fbbf24" font-size="10.5">Digital Image Processing (DIP) Pipeline</text>

      <g transform="translate(15, 62)">
        <rect width="105" height="42" rx="6" fill="#0d1726" stroke="#334155" />
        <text x="52" y="19" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Dynamic Contrast</text>
        <text x="52" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">Histogram stretch</text>
      </g>

      <g transform="translate(130, 62)">
        <rect width="105" height="42" rx="6" fill="#0d1726" stroke="#334155" />
        <text x="52" y="19" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Unsharp Masking</text>
        <text x="52" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">3x3 kernel filter</text>
      </g>

      <g transform="translate(245, 62)">
        <rect width="105" height="42" rx="6" fill="#0d1726" stroke="#334155" />
        <text x="52" y="19" fill="#e2e8f0" font-size="10" font-weight="600" text-anchor="middle">Otsu Threshold</text>
        <text x="52" y="33" fill="#94a3b8" font-size="9" text-anchor="middle">Adaptive binarize</text>
      </g>
    </g>

    <!-- Arrow B -> C -->
    <line x1="745" y1="110" x2="790" y2="110" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />

    <!-- Step C: QR Decoder Hand-off -->
    <g transform="translate(805, 52)">
      <rect width="260" height="115" rx="10" fill="#151f33" stroke="#334155" stroke-width="1" />
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#1e293b" />
      <text x="29" y="34" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">C</text>
      <text x="52" y="28" fill="#f8fafc" font-size="13" font-weight="700">QR Decoder (Step 2)</text>
      <text x="52" y="44" fill="#94a3b8" font-size="10.5">Feeds restored frame to jsQR</text>

      <text x="15" y="78" fill="#94a3b8" font-size="11">• Re-attempts finder square detection</text>
      <text x="15" y="96" fill="#f59e0b" font-size="11">• Status: Under development &amp; research</text>
    </g>
  </g>

  <!-- Footer Credits -->
  <g transform="translate(60, 755)">
    <text x="0" y="0" fill="#64748b" font-size="11">QR Guard · Department of Computer Engineering · Academic Project Evaluation Flowchart</text>
    <text x="1080" y="0" fill="#64748b" font-size="11" text-anchor="end">Client-Side Architecture · Zero Data Tracking</text>
  </g>
</svg>
